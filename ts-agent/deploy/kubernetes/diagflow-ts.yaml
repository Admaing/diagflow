# DiagFlow TS agent (Pi SDK) — parallel deployment next to diagflow-go.
#
# Render the tag and apply:
#   export IMAGE_TAG=ts-0.1.5
#   envsubst < deploy/kubernetes/diagflow-ts.yaml | x6 apply -f -
#
# Prerequisites:
#   - image hub.ucloudadmin.com/diaflow/diagflow-ts:${IMAGE_TAG} is built and pushed
#   - Secret diagflow-secrets has MODELVERSE_API_KEY and DIAGFLOW_AUTH_TOKEN
#   - Secret diagflow-mcp-tokens has DIAGFLOW_MCP_CLIENT_TOKEN
#   - Deployment/Service diagflow-mcp exists in this namespace
apiVersion: apps/v1
kind: Deployment
metadata:
  name: diagflow-ts
  namespace: prj-diaflow
  labels:
    app: diagflow-ts
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: diagflow-ts
  template:
    metadata:
      labels:
        app: diagflow-ts
    spec:
      securityContext:
        runAsNonRoot: true
        # node:22-bookworm-slim's "node" user.
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        # No seccompProfile: this cluster's API server predates the field and
        # rejects the whole manifest with "unknown field seccompProfile".
      containers:
        - name: diagflow-ts
          image: hub.ucloudadmin.com/diaflow/diagflow-ts:${IMAGE_TAG}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: NODE_ENV
              value: "production"
            # Pi/session scratch space; /tmp is an emptyDir below.
            - name: HOME
              value: "/tmp/diagflow-ts/home"
            - name: TMPDIR
              value: "/tmp"
            - name: TS_AGENT_PORT
              value: "8099"
            - name: TS_AGENT_STRATEGIES_DIR
              value: "/app/data/strategies"
            - name: TS_AGENT_LANGUAGE
              value: "zh-CN"
            - name: TS_AGENT_MAX_CONCURRENT
              value: "2"
            - name: TS_AGENT_MCP_STARTUP_WAIT_MS
              value: "15000"
            # Model: modelverse is UCloud's OpenAI-compatible gateway. The catalog
            # entry (baseUrl, api) lives in the ConfigMap below; the key must come
            # from MODELVERSE_API_KEY / TS_AGENT_LLM_API_KEY, NOT DEEPSEEK_API_KEY
            # (that variable is the api.deepseek.com key and gets a 401 here).
            - name: PI_MODEL_PROVIDER
              value: "modelverse"
            - name: PI_MODEL_ID
              value: "deepseek-v4.1-flash-1017"
            - name: PI_THINKING_LEVEL
              value: "medium"
            - name: TS_AGENT_MODELS_JSON
              value: "/etc/diagflow-ts/models.json"
            - name: TS_AGENT_LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: diagflow-secrets
                  key: MODELVERSE_API_KEY
            # Bearer token for POST /api/v1/{investigate,diagnose}. Reuses the
            # Go service's token so one gateway rule covers both.
            - name: TS_AGENT_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: diagflow-secrets
                  key: DIAGFLOW_AUTH_TOKEN
            # Cluster access: only through the read-only MCP gateway.
            - name: DIAGFLOW_MCP_BASE_URL
              value: "http://diagflow-mcp.prj-diaflow:8090/mcp"
            - name: DIAGFLOW_MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: diagflow-mcp-tokens
                  key: DIAGFLOW_MCP_CLIENT_TOKEN
            # Console sessions (optional). Until a MySQL is deployed in this
            # namespace, leave this unset: the console then runs single-shot and
            # /api/v1/sessions returns 503.
            # - name: TS_AGENT_MYSQL_URL
            #   valueFrom:
            #     secretKeyRef:
            #       name: diagflow-secrets
            #       key: MYSQL_URL
            # - name: TS_AGENT_SESSION_MAX_TURNS
            #   value: "5"
            # Monitoring (optional). Set these when Prometheus/Alertmanager are
            # reachable from this namespace; otherwise the agent still works
            # with diagflow tools alone.
            # - name: PROMETHEUS_URL
            #   value: "http://prometheus:9090"
            # - name: ALERTMANAGER_URL
            #   value: "http://alertmanager:9093"
          ports:
            - containerPort: 8099
              name: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: models
              mountPath: /etc/diagflow-ts
              readOnly: true
      imagePullSecrets:
        - name: paasuhadoop
      volumes:
        - name: tmp
          emptyDir: {}
        - name: models
          configMap:
            name: diagflow-ts-models
---
# Provider catalog for Pi. Keep in sync with ts-agent/models.json: a provider
# that is not declared here is unknown to Pi, and a wrong baseUrl fails as a
# bare 401/404 from the gateway.
apiVersion: v1
kind: ConfigMap
metadata:
  name: diagflow-ts-models
  namespace: prj-diaflow
  labels:
    app: diagflow-ts
data:
  models.json: |
    {
      "$schema": "https://pi.dev/schemas/models.schema.json",
      "providers": {
        "modelverse": {
          "name": "Modelverse (UCloud)",
          "baseUrl": "https://api.modelverse.cn/v1",
          "api": "openai-completions",
          "authHeader": true,
          "compat": { "thinkingFormat": "deepseek" },
          "models": [
            {
              "id": "deepseek-v4.1-flash-1017",
              "name": "DeepSeek V4.1 Flash 1017 (modelverse)",
              "reasoning": true,
              "contextWindow": 1000000,
              "maxTokens": 64000,
              "cost": { "input": 0.3, "output": 1.2, "cacheRead": 0.006, "cacheWrite": 0 }
            },
            {
              "id": "deepseek-v4.1-flash",
              "name": "DeepSeek V4.1 Flash (modelverse)",
              "reasoning": true,
              "contextWindow": 1000000,
              "maxTokens": 64000,
              "cost": { "input": 0.3, "output": 1.2, "cacheRead": 0.006, "cacheWrite": 0 }
            }
          ]
        }
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: diagflow-ts
  namespace: prj-diaflow
  labels:
    app: diagflow-ts
spec:
  selector:
    app: diagflow-ts
  ports:
    - name: http
      protocol: TCP
      port: 8099
      targetPort: 8099
  type: ClusterIP
