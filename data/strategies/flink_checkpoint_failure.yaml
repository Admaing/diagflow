component: flink
problem_type: checkpoint_failure
version: ">=1.14"

steps:
  - action: fingerprint_match
    description: "Check known Flink checkpoint issues first"
    priority: 0

  - action: tool_call
    tool: call_umr_agent
    description: "Scan TaskManager log for checkpoint failures"
    params:
      node_name: "core1"
      action: "GetLogs"
      params:
        Path: "/data/flink/log/taskmanager.log"
        Keywords: "Checkpoint,checkpoint,expired,FAILED,barrier,alignment"
        MaxLines: "100"
    priority: 1

  - action: tool_call
    tool: ssh_exec
    description: "Grep JobManager log for checkpoint expiry and barrier alignment"
    params:
      node_name: "master1"
      cmd: "grep -E 'Checkpoint|checkpoint|expired|barrier|alignment' /data/flink/log/jobmanager.log 2>/dev/null | tail -100"
      timeout_s: 15
    priority: 1

  - action: tool_call
    tool: deepwiki_query
    description: "Verify checkpoint expiry pattern against upstream known bugs"
    params:
      component: "flink"
      question: "Flink checkpoint failure / alignment timeout due to backpressure in version {{ context.version }}"
      version: "{{ context.version }}"
    priority: 2

knowledge_base:
  fingerprint: true
  semantic_search: true
  bm25_search: true

validation:
  required_evidence_sources: ["log"]
  min_evidence_count: 2

output:
  suggestions_min: 2
  suggestions_max: 4
