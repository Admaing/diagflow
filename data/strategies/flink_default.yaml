component: flink
description: "Default Flink diagnosis strategy — for unknown Flink problem types"
version: ">=1.14"

steps:
  - action: fingerprint_match
    description: "Check known Flink issues first"
    priority: 0

  - action: tool_call
    tool: query_yarn
    description: "Check YARN for failed Flink apps"
    params:
      action: "list_apps"
      app_name: "RUNNING,FAILED,KILLED,FINISHED"
    priority: 1

  - action: tool_call
    tool: call_umr_agent
    description: "Get cluster node base info (CPU/mem/disk)"
    params:
      node_name: "master1"
      action: "GetBaseInfo"
    priority: 1

  - action: tool_call
    tool: ssh_exec
    description: "Scan TaskManager/JobManager logs for errors"
    params:
      node_name: "master1"
      cmd: "grep -E 'ERROR|Exception|FATAL' /data/flink/log/jobmanager.log 2>/dev/null | tail -100"
      timeout_s: 30
    priority: 2

  - action: tool_call
    tool: deepwiki_query
    description: "Verify error class against upstream known bugs"
    params:
      component: "flink"
      question: "Flink job failure / error in version {{ context.version }}"
      version: "{{ context.version }}"
    priority: 3

knowledge_base:
  fingerprint: true
  semantic_search: true
  bm25_search: true

validation:
  required_evidence_sources: ["log"]
  min_evidence_count: 1

output:
  suggestions_min: 2
  suggestions_max: 5
