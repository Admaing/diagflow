component: yarn
problem_type: queue_stuck
version: ">=3.3"

steps:
  - action: fingerprint_match
    description: "Check known YARN queue issues first"
    priority: 0

  - action: tool_call
    tool: query_yarn
    description: "List YARN apps, including ACCEPTED (queued) and pending states"
    params:
      action: "list_apps"
      app_name: "RUNNING,ACCEPTED,PENDING,SUBMITTED"
    priority: 1

  - action: tool_call
    tool: ssh_exec
    description: "Report per-queue capacity and pending app counts from ResourceManager"
    params:
      node_name: "master1"
      cmd: "yarn queue -status default 2>/dev/null; echo '---'; yarn top 2>/dev/null | head -30"
      timeout_s: 15
    priority: 1

  - action: tool_call
    tool: call_umr_agent
    description: "Scan ResourceManager log for capacity/pending/denied messages"
    params:
      node_name: "master1"
      action: "GetLogs"
      params:
        Path: "/data/hadoop/log/yarn/hadoop-yarn-resourcemanager*.log"
        Keywords: "capacity,pending,denied,maxCapacity,ACCEPTED"
        MaxLines: "100"
    priority: 2

  - action: tool_call
    tool: deepwiki_query
    description: "Verify YARN queue capacity behavior against upstream known bugs"
    params:
      component: "yarn"
      question: "YARN queue stuck / capacity exhausted / pending apps in version {{ context.version }}"
      version: "{{ context.version }}"
    priority: 3

knowledge_base:
  fingerprint: true
  semantic_search: true
  bm25_search: true

validation:
  required_evidence_sources: ["log"]
  min_evidence_count: 2

output:
  suggestions_min: 2
  suggestions_max: 4
