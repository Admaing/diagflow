component: hdfs
problem_type: disk_full
version: ">=3.3"

steps:
  - action: fingerprint_match
    description: "Check known HDFS disk issues first"
    priority: 0

  - action: tool_call
    tool: ssh_exec
    description: "Report DataNode disk usage and remaining capacity"
    params:
      node_name: "core1"
      cmd: "hdfs dfsadmin -report 2>/dev/null | grep -E 'DFS|Capacity|Remaining|Datanode' | head -20"
      timeout_s: 15
    priority: 1

  - action: tool_call
    tool: call_umr_agent
    description: "Scan DataNode log for NoSpaceLeft / disk full errors"
    params:
      node_name: "core1"
      action: "GetLogs"
      params:
        Path: "/data/hadoop/log/hdfs/hadoop-hdfs-datanode*.log"
        Keywords: "NoSpaceLeft,disk full,FAILED,out of space"
        MaxLines: "100"
    priority: 1

  - action: tool_call
    tool: ssh_exec
    description: "Check raw disk space on data volumes"
    params:
      node_name: "core1"
      cmd: "df -h /data 2>/dev/null; echo '---'; du -sh /data/* 2>/dev/null | sort -rh | head -10"
      timeout_s: 15
    priority: 2

  - action: tool_call
    tool: deepwiki_query
    description: "Verify HDFS disk-full failure mode against upstream known bugs"
    params:
      component: "hdfs"
      question: "HDFS DataNode volume out of space / NoSpaceLeft error in version {{ context.version }}"
      version: "{{ context.version }}"
    priority: 3

knowledge_base:
  fingerprint: true
  semantic_search: true
  bm25_search: true
  fusion: rrf

validation:
  required_evidence_sources: ["log"]
  min_evidence_count: 2

output:
  suggestions_min: 2
  suggestions_max: 4
